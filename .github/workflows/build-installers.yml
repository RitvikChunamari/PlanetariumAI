name: Build Universal Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish Draft Release with Installers'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows x64 (MSI & NSIS .exe installers)
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            binary_ext: .exe
            bundle_artifact_name: PlanetariumAI-Windows-x64
            bundle_path: app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle

          # 2. macOS Apple Silicon (M1/M2/M3/M4 .dmg)
          - os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
            binary_ext: ''
            bundle_artifact_name: PlanetariumAI-macOS-AppleSilicon
            bundle_path: app/src-tauri/target/aarch64-apple-darwin/release/bundle

          # 3. macOS Intel (x86_64 .dmg)
          - os: macos-13
            platform: macos
            target: x86_64-apple-darwin
            binary_ext: ''
            bundle_artifact_name: PlanetariumAI-macOS-Intel
            bundle_path: app/src-tauri/target/x86_64-apple-darwin/release/bundle

          # 4. Linux x64 (.AppImage & .deb)
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
            binary_ext: ''
            bundle_artifact_name: PlanetariumAI-Linux-x64
            bundle_path: app/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.bundle_artifact_name }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust Build Artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Python Backend Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r core/requirements.txt || pip install pyinstaller fastapi uvicorn websockets torch torchaudio numpy faster-whisper kokoro-onnx onnxruntime lancedb sentence-transformers deepfilternet llama-cpp-python

      - name: Freeze Python Backend with PyInstaller
        shell: bash
        run: |
          mkdir -p app/src-tauri/binaries
          python core/build_backend.py --target ${{ matrix.target }}
          ls -la app/src-tauri/binaries/

      - name: Set Binary Permissions (Unix)
        if: matrix.platform != 'windows'
        run: |
          chmod +x app/src-tauri/binaries/planetarium-ai-server-${{ matrix.target }}

      - name: Stage Bundle Resources & Models
        shell: bash
        run: |
          mkdir -p app/src-tauri/resources/models
          mkdir -p app/src-tauri/resources/data
          # Stage vector database and knowledge resources
          if [ -d "core/data/lancedb" ]; then
            cp -r core/data/lancedb app/src-tauri/resources/data/
          fi
          # Stage models if present in repository/cache
          if [ -d "core/models" ]; then
            cp -r core/models/* app/src-tauri/resources/models/ || true
          fi
          # Ensure Kokoro ONNX and voices are downloaded if not present
          if [ ! -f "app/src-tauri/resources/models/kokoro-v1.0.onnx" ]; then
            echo "Downloading Kokoro ONNX model..."
            curl -L -s --retry 3 -o app/src-tauri/resources/models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          fi
          if [ ! -f "app/src-tauri/resources/models/voices-v1.0.bin" ]; then
            echo "Downloading voices data..."
            curl -L -s --retry 3 -o app/src-tauri/resources/models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          fi

      - name: Install Frontend Dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build React Frontend
        working-directory: app
        run: pnpm run build

      - name: Build Tauri Desktop Installer
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build --target ${{ matrix.target }}

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle_artifact_name }}
          path: |
            ${{ matrix.bundle_path }}/msi/*.msi
            ${{ matrix.bundle_path }}/nsis/*.exe
            ${{ matrix.bundle_path }}/dmg/*.dmg
            ${{ matrix.bundle_path }}/appimage/*.AppImage
            ${{ matrix.bundle_path }}/deb/*.deb
            app/src-tauri/target/**/bundle/msi/*.msi
            app/src-tauri/target/**/bundle/nsis/*.exe
            app/src-tauri/target/**/bundle/dmg/*.dmg
            app/src-tauri/target/**/bundle/appimage/*.AppImage
            app/src-tauri/target/**/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 14

  create-release:
    needs: build-installers
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Download Built Installers
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Display Release Binaries
        run: ls -R release-artifacts

      - name: Publish Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          name: PlanetariumAI ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*.msi
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
